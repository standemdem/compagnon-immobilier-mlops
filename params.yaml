model:
  type: random_forest

  random_forest:
    n_estimators: 50
    random_state: 42
    n_jobs: 2
    max_depth: 20
    min_samples_leaf: 2

  hist_gradient_boosting:
    max_iter: 100
    learning_rate: 0.1
    max_depth: 20
    min_samples_leaf: 20
    random_state: 42

training:
  test_year: 2024
  scope: paris

target_filter:
  lower_quantile: 0.01
  upper_quantile: 0.99
