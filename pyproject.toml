[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "compagnon-immobilier-mlops"
version = "0.1.0"
description = "Pipeline MLOps pour la prédiction du prix au m² immobilier"
requires-python = ">=3.12"

dependencies = [
    "pandas",
    "pyarrow",
    "requests",
    "scikit-learn",
    "pydantic",
    "fastapi",
    "python-dotenv",
    "uvicorn",

    "dvc==3.67.1",
    "dvc-gdrive==3.0.1",
    "PyDrive2==1.21.3",
    "pyOpenSSL==24.2.1",
    "cryptography==43.0.3",
    "asyncssh==2.21.1",

    "mlflow==3.5.0",
]

[tool.setuptools.packages.find]
where = ["src"]