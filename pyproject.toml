[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "compagnon-immobilier-mlops"
version = "0.1.0"
description = "Pipeline MLOps pour la prédiction du prix au m² immobilier"
requires-python = ">=3.12"

dependencies = [
    "pandas==2.3.3",
    "scikit-learn==1.9.0",
]

[project.optional-dependencies]

api = [
    "pydantic==2.13.4",
    "fastapi==0.141.1",
    "python-dotenv==1.2.3",
    "uvicorn==0.52.4",
    "prometheus-client==0.26.0",
    "mlflow==3.5.0",
    "shapely==2.1.2",
]

pipeline = [
    "pyarrow==21.0.0",
    "requests==2.34.2",

    "dvc==3.67.1",
    "dvc-gdrive==3.0.1",
    "PyDrive2==1.21.3",
    "pyOpenSSL==24.2.1",
    "cryptography==43.0.3",
    "asyncssh==2.21.1",

    "mlflow==3.5.0",

    "PyYAML==6.0.3",
]

test = [
    "pytest==8.4.2",
    "httpx==0.28.1",
]

[tool.setuptools.packages.find]
where = ["src"]