services:
  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: compagnon_api

    env_file:
      - .env

    expose:
      - "8000"

    restart: unless-stopped

  nginx:
    image: nginx:latest

    container_name: compagnon_nginx

    ports:
      - "8080:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

    depends_on:
      - api

    restart: unless-stopped
  
  dvc:
    build:
      context: .
      dockerfile: Dockerfile.dvc-runner

    container_name: compagnon_dvc

    working_dir: /workspace

    volumes:
      - .:/workspace
      - ${HOME}/.cache/pydrive2fs:/root/.cache/pydrive2fs

    profiles:
      - tools