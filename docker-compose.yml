services:
  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: compagnon_api

    env_file:
      - .env

    expose:
      - "8000"

    restart: unless-stopped

  nginx:
    image: nginx:latest

    container_name: compagnon_nginx

    ports:
      - "8080:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

    depends_on:
      - api

    restart: unless-stopped
  
  dvc:
    build:
      context: .
      dockerfile: Dockerfile.dvc-runner

    container_name: compagnon_dvc

    working_dir: /workspace

    volumes:
      - .:/workspace
      - ${HOME}/.cache/pydrive2fs:/root/.cache/pydrive2fs

    environment:
     MLFLOW_TRACKING_URI: http://mlflow:5000

    depends_on:
      - mlflow

    profiles:
      - tools
  
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.5.0

    container_name: compagnon_mlflow

    ports:
      - "5000:5000"

    volumes:
      - ./mlflow:/mlflow

    command:
      - mlflow
      - server
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --allowed-hosts
      - "localhost:*,127.0.0.1:*,mlflow:5000"
      - --backend-store-uri
      - sqlite:////mlflow/mlflow.db
      - --default-artifact-root
      - /mlflow/artifacts

    restart: unless-stopped