services:
  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: compagnon_api

    env_file:
      - .env

    expose:
      - "8000"

    restart: unless-stopped

  nginx:
    image: nginx:latest

    container_name: compagnon_nginx

    ports:
      - "8080:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

    depends_on:
      - api

    restart: unless-stopped